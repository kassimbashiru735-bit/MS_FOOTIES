    .cat-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px; border: 3px solid #ff9800; }
    
    .card { background: #111; border-radius: 12px; padding: 12px; margin: 14px auto; max-width: 360px; }
    .card img { width: 100%; border-radius: 10px; }
    .card h3 { color: #fff; text-align: center; } 
    
    input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #555; box-sizing: border-box; }
    
    .small-btn { width: auto; padding: 8px 16px; margin: 0 auto 20px; display: table; font-size: 14px; }

    .info-bar { text-align: center; font-size: 14px; color: #555; margin: 20px 0; }
    .wa-float { position: fixed; bottom: 20px; right: 20px; background: #25d366; color: white; padding: 15px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; }

    /* Footer Styles */
    footer { text-align: center; padding: 20px; color: #777; font-size: 12px; border-top: 1px solid #eee; margin-top: 30px; }
    
    /* Loading Spinner */
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #ff0000; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

function show(id){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
    document.getElementById(id).classList.add('show');
}

function openCol(c){
    col=c;
    let arr=c=='men'?men:women;
    
    // Automatic numeric sort (lowest to highest) just in case
    arr.sort((a, b) => Number(a[0]) - Number(b[0]));

    document.getElementById('title').textContent = c=="men" ? "MEN'S COLLECTION" : "WOMEN'S COLLECTION";
    const list = document.getElementById('list');
    list.innerHTML='<div class="spinner"></div>';
    setTimeout(()=>{
        list.innerHTML='';
        arr.forEach(p=>{
            list.innerHTML+=`<div class=card><img src='${p[1]}'><h3>GHS ${p[0]}</h3><button class=btn onclick="buy('${p[0]}','${p[1]}')">BUY</button></div>`;
        });
    },500);
    show('collection');
}

function buy(price,img){ current={price,img}; show('order'); }
function backHome(){ show('home'); } 
function backCol(){ show('collection'); }

function send(){
    const nameVal = document.getElementById('name').value;
    const locVal = document.getElementById('loc').value;
    const phoneVal = document.getElementById('phone').value;
    const sizeVal = document.getElementById('size').value;
    const qtyVal = document.getElementById('qty').value;

    let t = `🛍️ NEW ORDER - AMBAR_FOOTIES\n\nPrice: GHS ${current.price}\nName: ${nameVal}\nLocation: ${locVal}\nPhone: ${phoneVal}\nFoot Size: ${sizeVal}\nQuantity: ${qtyVal}\nProduct Image: ${current.img}`;
    
    window.open('https://wa.me/'+num+'?text='+encodeURIComponent(t),'_blank');
}
